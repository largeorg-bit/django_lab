{% extends "catalog/base.html" %}

{% block title %}Удаление продукта — Skystore{% endblock %}

{% block header %}
    <div class="pricing-header px-3 py-3 pt-md-5 pb-md-4 mx-auto text-center">
        <h1 class="display-4">Удаление продукта</h1>
    </div>
{% endblock %}

{% block content %}
    <div class="row">
        <div class="col-lg-8 mx-auto">
            <div class="alert alert-warning">
                Вы действительно хотите удалить продукт «{{ object.name }}»?
            </div>
            <form method="post">
                {% csrf_token %}
                <button type="submit" class="btn btn-danger">Удалить</button>
                <a
                    class="btn btn-outline-secondary"
                    href="{% url 'product_detail' object.pk %}"
                >
                    Отмена
                </a>
            </form>
        </div>
    </div>
{% endblock %}
